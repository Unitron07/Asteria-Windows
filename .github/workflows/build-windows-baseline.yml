name: Build Windows upstream/Asteria baseline
on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      label:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout build harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: harness
          persist-credentials: false
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-ref }}
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Test build preflight guards
        shell: pwsh
        run: ./harness/scripts/test-baseline-preflight.ps1
      - name: Test package architecture guards
        shell: pwsh
        run: ./harness/scripts/test-package-architecture-tests.ps1
      - name: Test ARM64 runtime packaging repair
        shell: pwsh
        run: ./harness/scripts/test-arm64-package-repair.ps1
      - name: Install Qt x64 host kit
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.11.2'
          arch: win64_msvc2022_64
          cache: true
          set-env: false
          add-tools-to-path: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e
      - name: Install Qt ARM64 target kit
        if: inputs.architecture == 'arm64'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.11.2'
          arch: win64_msvc2022_arm64_cross_compiled
          cache: true
          set-env: false
          add-tools-to-path: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e
      - name: Verify and extract Windows dependencies
        shell: pwsh
        run: ./harness/scripts/setup-baseline-deps.ps1 -SourceRoot ./source -Architecture '${{ inputs.architecture }}'
      - name: Build unsigned Release and collect evidence
        shell: pwsh
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
          QT_ROOT: ${{ runner.workspace }}/Qt/6.11.2
        run: |
          $kit = switch ($env:TARGET_ARCH) {
            'x64' { 'msvc2022_64' }
            'arm64' { 'msvc2022_arm64' }
            default { throw "Unsupported target: $env:TARGET_ARCH" }
          }
          ./harness/scripts/build-baseline.ps1 -SourceRoot ./source -Architecture $env:TARGET_ARCH -QtBin "$env:QT_ROOT/$kit/bin"
      - name: Verify ordinary package excludes experimental PyroWave runtime
        if: inputs.label == 'asteria'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'source/build/installer-${{ inputs.architecture }}-release' -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'Expected one ordinary portable package' }
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            if ($archive.Entries | Where-Object { $_.FullName.Replace('\','/') -match '(^|/)pyrowave/|(^|/)(libpyrowave-shared.*\.dll|pyrowave-runtime\.json)$' }) {
              throw 'Ordinary package contains experimental PyroWave runtime files'
            }
          } finally { $archive.Dispose() }
          $dumpbin = Get-Content 'source/build/evidence/${{ inputs.architecture }}/dumpbin-path.txt' | Select-Object -First 1
          $imports = & $dumpbin /imports 'source/build/deploy-${{ inputs.architecture }}-release/Asteria.exe'
          if ($LASTEXITCODE) { throw 'Cannot inspect ordinary client imports' }
          $imports | Set-Content 'source/build/evidence/${{ inputs.architecture }}/baseline-client-imports.txt'
          if ($imports -match 'libpyrowave-shared|vulkan-1\.dll') { throw 'Ordinary client has an experimental startup import' }
      - name: Verify packaged Asteria icon resources
        if: inputs.label == 'asteria'
        shell: pwsh
        run: python ./harness/scripts/verify-asteria-package-icons.py --source-root ./source --architecture '${{ inputs.architecture }}'
      - name: Upload portable package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: baseline-${{ inputs.label }}-windows-${{ inputs.architecture }}-${{ github.run_id }}
          path: source/build/installer-${{ inputs.architecture }}-release/*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: symbols-${{ inputs.label }}-windows-${{ inputs.architecture }}-${{ github.run_id }}
          path: source/build/symbols-${{ inputs.architecture }}-release/*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload corresponding source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-${{ inputs.label }}-windows-${{ inputs.architecture }}-${{ github.run_id }}
          path: source/build/evidence/${{ inputs.architecture }}/source.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Upload build evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-${{ inputs.label }}-windows-${{ inputs.architecture }}-${{ github.run_id }}
          path: source/build/evidence/${{ inputs.architecture }}/
          if-no-files-found: warn
