name: Moonlight upstream sync
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: moonlight-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          # GITHUB_TOKEN can never push changes under .github/workflows/. The optional
          # UPSTREAM_SYNC_TOKEN secret (see docs/UPSTREAM_SYNC.md) can; checkout keeps it
          # as the push credential. Without the secret, behavior is unchanged.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - name: Test sync state transitions
        run: python -m unittest discover -s tests/upstream -v
      - name: Propose history-preserving upstream merge
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: python scripts/sync-moonlight.py
